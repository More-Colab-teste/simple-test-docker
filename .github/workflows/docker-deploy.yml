name: CI/CD Pipeline

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy to self-hosted runner
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Start/restart app with PM2
        run: |
          APP_DIR=/home/ubuntu/BIOma/simple-test

          # If folder doesn't exist, clone repo
          if [ ! -d "$APP_DIR" ]; then
            mkdir -p $APP_DIR
            git clone https://github.com/${{ github.repository }} $APP_DIR
          fi

          cd $APP_DIR
          git fetch origin
          git checkout production
          git reset --hard origin/production

          # Install dependencies
          npm ci

          # Start/restart app using PM2
          pm2 start app.js --name simple-test || pm2 restart simple-test
          pm2 save
